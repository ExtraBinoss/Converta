name: Verify and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: converta-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run format:check && bun run test:coverage
      - run: bun run build
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bunx playwright install --with-deps chromium firefox
      - run: bun run test:browser --workers=2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: >-
          github.repository == 'ExtraBinoss/Converta' &&
          github.ref == 'refs/heads/main' &&
          github.actor_id == '113912449' &&
          github.triggering_actor == 'ExtraBinoss' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: site-${{ github.sha }}
          path: dist/
          include-hidden-files: false
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: verify
    if: >-
      github.repository == 'ExtraBinoss/Converta' &&
      github.ref == 'refs/heads/main' &&
      github.actor_id == '113912449' &&
      github.triggering_actor == 'ExtraBinoss' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://converta.plinka.eu
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: site-${{ github.sha }}
          path: dist/
      - uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.151.2"
          command: pages deploy dist --project-name converta-plinka --branch main --commit-hash ${{ github.sha }}
