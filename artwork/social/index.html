<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1200" />
    <title>Converta — image de partage</title>
    <link rel="stylesheet" href="/assets/theme.css" />
    <style>
      @font-face {
        font-family: "Source Sans 3";
        src: url("/assets/source-sans.woff2");
        font-weight: 200 900;
      }
      @font-face {
        font-family: "Space Grotesk";
        src: url("/assets/space-grotesk.woff2");
        font-weight: 300 700;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        background: var(--background);
        color: var(--foreground);
        font-family: "Source Sans 3", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .logo {
        position: absolute;
        left: 64px;
        top: 43px;
        width: 164px;
        height: 34px;
        object-fit: contain;
      }
      h1 {
        position: absolute;
        left: 64px;
        top: 105px;
        margin: 0;
        font-family: "Space Grotesk", sans-serif;
        font-weight: 500;
        font-size: 46px;
        letter-spacing: -2px;
        line-height: 1.2;
      }
      p {
        position: absolute;
        left: 64px;
        top: 169px;
        margin: 0;
        color: var(--muted-foreground);
        font-size: 22px;
      }
      .product {
        position: absolute;
        left: 64px;
        top: 226px;
        width: 1072px;
        height: auto;
      }
      .domain {
        position: absolute;
        right: 64px;
        bottom: 28px;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 19px;
        color: var(--muted-foreground);
      }
      .domain svg {
        width: 19px;
        height: 19px;
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/assets/wordmark.svg" alt="Converta" />
    <h1>Un fichier. Un nouveau format.</h1>
    <p>Images, vidéos, audio. Convertis dans votre navigateur.</p>
    <img
      class="product"
      src="/assets/conversion.png"
      alt="Trois conversions terminées dans Converta : une image en WebP, une vidéo en MP4 et un fichier audio en MP3."
    />
    <span class="domain"
      ><svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="10" />
        <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20M2 12h20" /></svg
      >converta.plinka.eu</span
    >
  </body>
</html>
